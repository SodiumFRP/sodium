# AppVeyor build for the .NET implementation under dotnet/src/Sodium.
#
# NOTE: committing this file supersedes the configuration currently held in the AppVeyor UI.
# Compare the two before enabling "use YAML from repository".
#
# Package versions are NOT set here. Each packable project derives its own version from git tags
# via MinVer (see dotnet/src/Sodium/Directory.Build.props), so pushing dotnet-async-csharp-1.1.0
# releases only SodiumFRP.Async and leaves every other package on its own last tag. Deliberately
# absent, therefore, is AppVeyor's dotnet_csproj patcher: it stamps every matched project with a
# single shared version, which is the opposite of what this repository wants.

version: '{build}'

image: Visual Studio 2022

# MinVer reads the full commit graph and every tag. A shallow clone yields wrong versions, or none.
shallow_clone: false
clone_depth: 0

configuration: Release

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: dotnet\src\Sodium\Sodium.sln

# nuget restore, not dotnet restore: four of the C# test projects are legacy, non-SDK projects
# using packages.config, which dotnet restore ignores. nuget restore handles both those and the
# PackageReference projects.
before_build:
  - dotnet --info
  - nuget restore %SOLUTION%

# msbuild, not dotnet build, for the same reason — it is the only one of the two that can build the
# legacy test projects.
build_script:
  - msbuild %SOLUTION% /p:Configuration=%CONFIGURATION% /v:minimal /m

# Only the two F# test projects are SDK-style with Microsoft.NET.Test.Sdk and NUnit3TestAdapter, so
# only they are runnable by dotnet test.
#
# The four legacy C# test projects (Sodium.Frp.Tests, .Tests.Internal, .Tests.Memory,
# .Tests.Performance) reference nunit.framework directly with no test adapter, so nothing here can
# discover them. Running them needs either the NUnit console runner or a migration to
# PackageReference plus NUnit3TestAdapter. Until one of those happens they are built but not run —
# see the commented block below for the console-runner route, which has not been verified on this
# image.
test_script:
  - dotnet test dotnet\src\Sodium\FSharp\Sodium.FSharp.Frp.Tests\Sodium.FSharp.Frp.Tests.fsproj -c %CONFIGURATION% --no-build
  - dotnet test dotnet\src\Sodium\FSharp\Sodium.FSharp.Frp.Tests.Internal\Sodium.FSharp.Frp.Tests.Internal.fsproj -c %CONFIGURATION% --no-build
  # - nuget install NUnit.ConsoleRunner -Version 3.11.1 -OutputDirectory tools
  # - tools\NUnit.ConsoleRunner.3.11.1\tools\nunit3-console.exe dotnet\src\Sodium\CSharp\Sodium.Frp.Tests\bin\%CONFIGURATION%\Sodium.Frp.Tests.dll

# Packed one project at a time rather than by solution: dotnet pack on the solution fails with
# MSB4057 ("the target Pack does not exist") on the four legacy test projects.
after_test:
  - dotnet pack dotnet\src\Sodium\Sodium.Core.Frp\Sodium.Core.Frp.csproj -c %CONFIGURATION% -o artifacts
  - dotnet pack dotnet\src\Sodium\CSharp\Sodium.Functional\Sodium.Functional.csproj -c %CONFIGURATION% -o artifacts
  - dotnet pack dotnet\src\Sodium\CSharp\Sodium.Frp\Sodium.Frp.csproj -c %CONFIGURATION% -o artifacts
  - dotnet pack dotnet\src\Sodium\FSharp\Sodium.FSharp.Frp\Sodium.FSharp.Frp.fsproj -c %CONFIGURATION% -o artifacts
  - dotnet pack dotnet\src\Sodium\Async\Sodium.Core.Frp.Async\Sodium.Core.Frp.Async.csproj -c %CONFIGURATION% -o artifacts
  - dotnet pack dotnet\src\Sodium\Async\CSharp\Sodium.Frp.Async\Sodium.Frp.Async.csproj -c %CONFIGURATION% -o artifacts
  - dotnet pack dotnet\src\Sodium\Async\FSharp\Sodium.FSharp.Frp.Async\Sodium.FSharp.Frp.Async.fsproj -c %CONFIGURATION% -o artifacts
  - ps: Get-ChildItem artifacts\*.nupkg | Sort-Object Name | ForEach-Object { Write-Host $_.Name }

artifacts:
  - path: artifacts\*.nupkg
    name: packages

# Publishing is gated on a tag, which is what makes the release schedule per-package: MinVer gives a
# tagged build a stable version and every other build a prerelease one, so only deliberate tags can
# ever produce something publishable.
#
# Two details worth keeping:
#   *.symbols.nupkg is excluded — these projects set IncludeSource/IncludeSymbols, which emits the
#   legacy symbols format that nuget.org rejects.
#   --skip-duplicate means re-running a build over an already published version is a no-op rather
#   than a failure, so packages whose version did not move are simply left alone.
deploy_script:
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -ne "true") {
          Write-Host "Not a tag build - skipping NuGet push."
          return
      }
      if (-not $env:NUGET_API_KEY) {
          throw "NUGET_API_KEY is not set. Add it as a secure variable in AppVeyor."
      }
      $packages = Get-ChildItem artifacts\*.nupkg | Where-Object { $_.Name -notlike "*.symbols.nupkg" }
      if (-not $packages) { throw "No packages found to push." }
      foreach ($package in $packages) {
          Write-Host "Pushing $($package.Name)"
          dotnet nuget push $package.FullName `
              --skip-duplicate `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw "Failed to push $($package.Name)" }
      }
